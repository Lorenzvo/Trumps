<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trumps</title>
    <meta name="description" content="A bidding trick-taking card game for 2 or 4 players — play online with friends in real time, no download or account needed." />
    <meta name="theme-color" content="#7c5cff" />

    <!-- Social share preview (Discord/iMessage/Slack/Twitter-X/etc. all read these —
         same card shows whether the link is the bare site or a ?room=CODE invite,
         since they're all the same page). NOTE: og:url/og:image are absolute per the
         Open Graph spec (relative paths aren't reliably resolved by crawlers) —
         update the domain in both once a custom domain replaces the default
         Firebase Hosting one this was set up with. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trumps" />
    <meta property="og:title" content="Trumps" />
    <meta property="og:description" content="A bidding trick-taking card game for 2 or 4 players — play online with friends in real time." />
    <meta property="og:url" content="https://trumps-28883.web.app/" />
    <meta property="og:image" content="https://trumps-28883.web.app/og-image.png" />
    <meta property="og:image:width" content="1228" />
    <meta property="og:image:height" content="644" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trumps" />
    <meta name="twitter:description" content="A bidding trick-taking card game for 2 or 4 players — play online with friends in real time." />
    <meta name="twitter:image" content="https://trumps-28883.web.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
